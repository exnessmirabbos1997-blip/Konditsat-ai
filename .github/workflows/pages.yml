# GitHub Pages: main branchga har merge'dan keyin avtomatik yangilanadi, lekin faqat sinovlar o'tgandan keyin.
# (Settings → Pages → Source = "GitHub Actions" bo'lishi kerak.)
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Faqat sayt fayllarini yig'ish va kesh versiyasini qo'shish
        run: |
          V=${GITHUB_SHA::7}
          mkdir _site
          cp -r index.html css js _site/
          sed -i -E "s#((js|css)/[A-Za-z0-9._-]+\.(js|css))\"#\1?v=${V}\"#g" _site/index.html
          grep -c "?v=${V}" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
